name: Product acceptance readiness

# Deliberately separate from engineering CI: unavailable product functionality must
# block a release claim, not appear as successful skipped E2E tests.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-readiness:
    name: Require real product acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enforce product evidence requirements
        env:
          HEXU_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/readiness.mjs --require-product
      - name: Explain blockers
        if: always()
        run: cat ci-results/readiness/readiness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain readiness result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-readiness-${{ github.run_attempt }}
          path: ci-results/readiness/
          if-no-files-found: error
          retention-days: 14
